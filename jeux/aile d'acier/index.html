<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a12">
<title>Aile d'Acier — Shoot'em up rétro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══════════════ ÉCRAN 0 : ACCUEIL ANIMÉ ══════════════ -->
<section id="ecran-accueil">
  <div class="accueil-scene">
    <canvas id="canvas-accueil" width="540" height="560"></canvas>
    <div class="rang-accueil">
      <button type="button" id="bouton-jouer">JOUER</button>
      <button type="button" id="bouton-survie" title="Terminez la campagne pour débloquer">SURVIE</button>
    </div>
    <p class="accueil-pied">Une aile d'acier contre trois mondes envahis.</p>
  </div>
</section>

<!-- ══════════════ ÉCRAN 1 : LA CARTE DE CAMPAGNE ══════════════ -->
<section id="ecran-carte" class="cache">
  <header class="entete">
    <canvas id="logo" width="60" height="55"></canvas>
    <div class="titre-bloc">
      <h1>AILE&nbsp;D'ACIER</h1>
      <p class="sous-titre">Campagne · Terre / Océan / Galaxie</p>
    </div>
  </header>

  <div class="barre-outils">
    <button type="button" class="bouton-carre" id="bouton-accueil" title="Retour à l'accueil">
      <svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>
    </button>
    <div class="stat" title="Étoiles gagnées">
      <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17l-6.1 3.6 1.4-6.8L2.2 9.1l6.9-.8z"/></svg>
      <span id="stat-etoiles">0/30</span>
    </div>
    <div class="stat neutre" title="Meilleur score">
      <svg viewBox="0 0 24 24"><path d="M6 2h2v20H6V2zm3 1h9l-2.6 4L18 11H9V3z"/></svg>
      <span id="stat-record">0</span>
    </div>
    <button type="button" class="bouton-carre" id="bouton-son" title="Son (M)">
      <svg id="son-on" viewBox="0 0 24 24"><path d="M3 9v6h4l6 5V4L7 9H3zm13.5 3a3.5 3.5 0 0 0-2-3.2v6.4a3.5 3.5 0 0 0 2-3.2zm-2-7.7v2.1a6 6 0 0 1 0 11.2v2.1a8 8 0 0 0 0-15.4z"/></svg>
      <svg id="son-off" viewBox="0 0 24 24" class="cache"><path d="M3 9v6h4l6 5V4L7 9H3z"/><path d="M2 4.5L4.1 2.4 21.6 19.9l-2.1 2.1z"/></svg>
    </button>
    <button type="button" class="bouton-carre" id="bouton-reset" title="Effacer la progression">
      <svg viewBox="0 0 24 24"><path d="M9 2h6v2h4v2H5V4h4V2zM6 7h12l-1 14H7L6 7zm3 3v9h2v-9H9zm4 0v9h2v-9h-2z"/></svg>
    </button>
  </div>

  <div id="carte-monde">
    <canvas id="fond-carte"></canvas>
    <div id="defilement-carte">
      <div id="contenu-carte">
        <svg id="trace"></svg>
        <!-- Les nœuds de niveau sont injectés par script.js -->
      </div>
    </div>
  </div>

  <footer class="pied">
    <p>Clavier : flèches ou ZQSD + Espace · Pause : P / Échap<br>
       Mobile : joystick à gauche, bouton TIR à droite</p>
  </footer>
</section>

<!-- Modale maison de confirmation (réinitialisation) -->
<div id="voile-modale">
  <div class="modale">
    <p>Effacer toute la progression ?</p>
    <div class="rang-boutons">
      <button type="button" id="bouton-confirmer">OUI</button>
      <button type="button" id="bouton-annuler">NON</button>
    </div>
  </div>
</div>

<!-- ══════════════ ÉCRAN 2 : LE JEU ══════════════ -->
<section id="ecran-jeu" class="cache">
  <div id="cadre-jeu">
    <canvas id="jeu" width="540" height="720"></canvas>
    <div id="scanlines"></div>
    <div id="overlay-tactile">
      <div id="base-joystick"><div id="knob"></div></div>
      <button type="button" id="bouton-tir">TIR</button>
      <button type="button" id="bouton-pause" title="Pause"></button>
    </div>
  </div>
</section>
<footer id="pied-page">
  <p>©Sluto — Ce jeu fait partie du <a href="../../index.html">Projet ToncPlay</a></p>
</footer>
<script src="niveaux.js"></script>
<script src="script.js"></script>
</body>
</html>
